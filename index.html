<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros GIFs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      display: flex;
      min-height: 100vh;
      width: 100vw;
      align-items: center;
      justify-content: center;
    }

    .lado {
      width: 50%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 95vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <section class="lado">
      <img src="mi-gif.gif" alt="Mi GIF">
    </section>

    <section class="lado">
      <img src="gif-companera.gif" alt="GIF de mi compañera">
    </section>
  </main>
</body>
</html>
